name: Packaging Linux - Vídeo Studio BR

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  deb:
    name: DEB + TGZ (Ubuntu 26.04)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-base-private-dev qt6-declarative-dev \
            qt6-tools-dev qt6-tools-dev-tools qt6-multimedia-dev \
            libqt6svg6-dev qt6-websockets-dev qt6-charts-dev \
            libmlt-dev libmlt++-dev libfftw3-dev frei0r-plugins-dev libsdl2-dev \
            libx11-dev libdbus-1-dev libgl1-mesa-dev libxkbcommon-dev \
            libvulkan-dev libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev
      - name: Configurar e compilar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr -DEXTERNAL_LAUNCHERS=ON
          cmake --build build --parallel 2
      - name: Gerar DEB e TGZ
        run: cpack --config build/CPackConfig.cmake -G "DEB;TGZ"
      - uses: actions/upload-artifact@v4
        with:
          name: video-studio-br-deb
          path: |
            video-studio-br*.deb
            video-studio-br*.tar.gz

  rpm:
    name: RPM (Fedora 44)
    runs-on: ubuntu-26.04
    container: fedora:44
    steps:
      - name: Dependências
        run: |
          dnf -y install git gcc gcc-c++ cmake ninja-build pkgconf-pkg-config \
            qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtdeclarative-devel \
            qt6-qttools-devel qt6-qtsvg-devel qt6-qtwebsockets-devel \
            qt6-qtcharts-devel qt6-qtmultimedia-devel \
            mlt-devel fftw-devel frei0r-devel SDL2-devel \
            libX11-devel dbus-devel mesa-libGL-devel libxkbcommon-devel \
            vulkan-devel rpm-build
      - uses: actions/checkout@v4
      - name: Configurar e compilar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr -DEXTERNAL_LAUNCHERS=ON
          cmake --build build --parallel 2
      - name: Gerar RPM
        run: cpack --config build/CPackConfig.cmake -G RPM
      - uses: actions/upload-artifact@v4
        with:
          name: video-studio-br-rpm
          path: video-studio-br*.rpm

  appimage:
    name: AppImage (Ubuntu 26.04)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-base-private-dev qt6-declarative-dev \
            qt6-tools-dev qt6-tools-dev-tools qt6-multimedia-dev \
            libqt6svg6-dev qt6-websockets-dev qt6-charts-dev \
            libmlt-dev libmlt++-dev libfftw3-dev frei0r-plugins-dev libsdl2-dev \
            libx11-dev libdbus-1-dev libgl1-mesa-dev libxkbcommon-dev \
            libvulkan-dev libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev desktop-file-utils libfuse2t64
      - name: Compilar e montar AppDir
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/AppDir/usr" -DEXTERNAL_LAUNCHERS=ON
          cmake --build build --parallel 2
          cmake --install build
          # Dependendo do CMAKE_INSTALL_LIBDIR o CuteLogger vai para lib/ ou lib/<triplo>.
          # Normalize em usr/lib para o linuxdeploy encontrá-lo.
          find AppDir/usr -name 'libCuteLogger.so' -not -path 'AppDir/usr/lib/libCuteLogger.so' \
            -exec cp -f {} AppDir/usr/lib/ \;
          cp AppDir/usr/share/applications/org.videostudiobr.VideoStudioBR.desktop AppDir/video-studio-br.desktop
          sed -i 's|^Exec=.*|Exec=video-studio-br|' AppDir/video-studio-br.desktop
          cp icons/studiocut-logo-64.svg AppDir/org.videostudiobr.VideoStudioBR.svg
          printf '#!/bin/sh\nexec "%s/usr/bin/video-studio-br" "$@"\n' '${DIR}' > AppDir/AppRun
          chmod +x AppDir/AppRun
      - name: linuxdeploy + appimagetool
        run: |
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          curl -fsSL -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          export LD_LIBRARY_PATH="$PWD/AppDir/usr/lib/x86_64-linux-gnu:$PWD/AppDir/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ./linuxdeploy --appdir AppDir --output appimage || true
          ./appimagetool AppDir Video_Studio_BR-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: video-studio-br-appimage
          path: Video_Studio_BR-x86_64.AppImage

  flatpak:
    name: Flatpak (Ubuntu 26.04, experimental)
    runs-on: ubuntu-26.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-base-private-dev qt6-declarative-dev \
            qt6-tools-dev qt6-tools-dev-tools qt6-multimedia-dev \
            libqt6svg6-dev qt6-websockets-dev qt6-charts-dev \
            libmlt-dev libmlt++-dev libfftw3-dev frei0r-plugins-dev libsdl2-dev \
            libx11-dev libdbus-1-dev libgl1-mesa-dev libxkbcommon-dev \
            libvulkan-dev libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Preparar fonte local
        run: |
          PREFIX="$PWD/packaging/flatpak/src/linux-app/usr"
          cmake -S . -B build-flatpak-src -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" -DEXTERNAL_LAUNCHERS=OFF
          cmake --build build-flatpak-src --parallel 2
          cmake --install build-flatpak-src
          mkdir -p "$PREFIX/lib"
          for lib in $(ldd build-flatpak-src/src/video-studio-br | awk '$3 ~ /^\// {print $3}'); do
            cp -L "$lib" "$PREFIX/lib/" 2>/dev/null || true
          done
      - name: Construir Flatpak
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --repo=repo build-flatpak packaging/flatpak/org.videostudiobr.VideoStudioBR.json
          flatpak build-bundle repo video-studio-br.flatpak org.videostudiobr.VideoStudioBR
      - uses: actions/upload-artifact@v4
        with:
          name: video-studio-br-flatpak
          path: video-studio-br.flatpak
          if-no-files-found: warn
